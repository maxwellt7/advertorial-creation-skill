[project]
name = "advertorial-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "pinecone>=5.0",
  "fal-client>=0.5",
  "pydantic>=2.5",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "respx>=0.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
